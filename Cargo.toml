[package]
name = "rust-musicfox"
version = "0.1.0"
edition = "2021"
description = "NetEase Cloud Music TUI client written in Rust (rewrite of go-musicfox)"
license = "MIT"

[[bin]]
name = "musicfox"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
crossterm = "0.28"
dirs = "6"
hex = "0.4"
md-5 = "0.10"
qrcode = "0.14"
rand = "0.8"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies", "charset"] }
rodio = { version = "0.20", features = ["symphonia-mp3", "symphonia-flac", "symphonia-vorbis", "symphonia-wav"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
urlencoding = "2"

[dependencies.aes]
version = "0.8"

[dependencies.cbc]
version = "0.1"

[dependencies.cipher]
version = "0.4"

[dependencies.rsa]
version = "0.9"

[profile.release]
lto = true
strip = true
